<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark rounded tile -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>
  <!-- Scanner ring -->
  <circle cx="16" cy="16" r="12" stroke="#f0883e" stroke-width="0.8" opacity="0.32"/>
  <!-- Letter A — left leg -->
  <line x1="9.5" y1="25.5" x2="16" y2="7" stroke="#f0883e" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Letter A — right leg -->
  <line x1="16" y1="7" x2="22.5" y2="25.5" stroke="#f0883e" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Letter A — crossbar -->
  <line x1="12" y1="17.5" x2="20" y2="17.5" stroke="#f0883e" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Scan-point dot (blue accent — the "eye" of Argus) -->
  <circle cx="16" cy="25.5" r="2.2" fill="#58a6ff"/>
</svg>
