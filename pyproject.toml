[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-scanner"
version = "1.1.0"
description = "Agentic Red-team and Governance Unified Scanner for LLM security"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sunil Gentyala", email = "sunil.gentyala@ieee.org" },
]
keywords = [
    "llm-security", "red-team", "prompt-injection", "owasp",
    "agentic-ai", "vulnerability-scanner", "cvss", "ai-safety",
    "ai-red-team", "llm-testing", "ai-governance", "sarif",
    "cvssv4", "compliance", "mcp-security", "rag-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "networkx>=3.3",
]

[project.optional-dependencies]
chromadb = ["chromadb>=0.5"]
qdrant   = ["qdrant-client>=1.10"]
pdf      = ["weasyprint>=62.0"]
dev      = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage      = "https://sunilgentyala.github.io/argus/"
Repository    = "https://github.com/sunilgentyala/argus"
Issues        = "https://github.com/sunilgentyala/argus/issues"
Documentation = "https://sunilgentyala.github.io/argus/"
Changelog     = "https://github.com/sunilgentyala/argus/releases"

[project.scripts]
argus = "argus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]
ignore = ["S101", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
